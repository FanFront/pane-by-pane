name: Verify pull request

on:
  push:
    branches: [feature/local-preset-levels]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify bundled upstream puzzle integration
        run: bash scripts/pull-betaller-puzzles.sh
      - run: npm run build
