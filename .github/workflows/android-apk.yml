name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-apk.yml
      - capacitor.config.json
      - scripts/build-android.sh
      - scripts/verify-android-signing.sh
      - scripts/create-android-debug-keystore.sh
      - scripts/pull-betaller-puzzles.sh
      - scripts/convert-betaller.mjs
      - ANDROID.md
      - src/**
      - public/presets/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/android-apk.yml
      - capacitor.config.json
      - scripts/build-android.sh
      - scripts/verify-android-signing.sh
      - scripts/create-android-debug-keystore.sh
      - scripts/pull-betaller-puzzles.sh
      - scripts/convert-betaller.mjs
      - ANDROID.md
      - src/**
      - public/presets/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Never expose the long-lived signing key to pull-request code. PRs are
      # still built using an ephemeral debug key for verification only.
      - name: Install persistent debug signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_DEBUG_KEYSTORE_BASE64}" ]]; then
            echo "::error::Set repository Actions secret ANDROID_DEBUG_KEYSTORE_BASE64 before producing an installable APK. See ANDROID.md."
            exit 1
          fi
          install -d -m 700 "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null
          echo "Persistent signing key installed (certificate fingerprint is checked after APK build)."

      - name: Build and test web game, package Android APK
        env:
          PBP_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            export PBP_ANDROID_SIGNING_KEYSTORE="$HOME/.android/debug.keystore"
          fi
          bash scripts/build-android.sh

      - name: Verify persistent APK signing certificate
        if: github.event_name != 'pull_request'
        run: bash scripts/verify-android-signing.sh

      - name: Upload installable APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pane-by-pane-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    # A release must never be generated from a pull request's temporary debug key.
    needs: android-debug
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: pane-by-pane-android-debug
          path: release

      - name: Publish Android APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-v0.1.${RELEASE_RUN_NUMBER}"
          apk="release/pane-by-pane-android-v0.1.${RELEASE_RUN_NUMBER}.apk"
          mv release/app-debug.apk "$apk"
          (cd release && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release tag $tag already exists. To avoid replacing a signed APK, refusing to overwrite it."
            exit 1
          fi

          cat > release-notes.md <<'NOTES'
          ### Pane by Pane — offline Android APK

          Personal-use Android sideload build. Includes the game player and bundled offline puzzle pack.

          **Signing:** This APK is signed with the persistent debug certificate configured in GitHub Actions. Updates require the *same* signing certificate and application ID. APKs built before persistent signing was enabled cannot be updated in place; preserve your existing local progress before migrating.

          **Install:** Download the attached APK and open it on your Android device. It is not an app-store release.

          SHA-256 checksum is attached for download integrity.
          NOTES

          gh release create "$tag" "$apk" "$apk.sha256" \
            --target "$RELEASE_COMMIT" \
            --title "Android APK 0.1.${RELEASE_RUN_NUMBER}" \
            --notes-file release-notes.md \
            --prerelease

          echo "Release: https://github.com/${GH_REPO}/releases/tag/${tag}"
