name: Deploy to GitHub Pages (optional)

# This fork primarily publishes offline Android APKs. Do not fail every push
# trying to auto-enable a Pages site with GITHUB_TOKEN (which lacks the
# administration permission needed to create it).
#
# To publish the browser version, first go to repository Settings > Pages >
# Build and deployment > Source: GitHub Actions, then manually run this
# workflow from the Actions tab. No Pages site is needed to build the APK.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pull upstream Glimmith puzzles for bundled offline play
        run: bash scripts/pull-betaller-puzzles.sh
      - run: npm run build
      # Only configure an already enabled Pages site; never attempt to create
      # one with GITHUB_TOKEN (GitHub denies that with a 403).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
